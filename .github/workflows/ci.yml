name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dispatch server Docker image build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVER_DISPATCH_TOKEN: ${{ secrets.DACOLLECTOR_SERVER_DISPATCH_TOKEN }}
          WEBUI_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SERVER_DISPATCH_TOKEN" ]; then
            echo "::warning::DACOLLECTOR_SERVER_DISPATCH_TOKEN is not configured. Skipping server Docker image rebuild."
            exit 0
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SERVER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Iranman/DaCollector/dispatches \
            -d "{\"event_type\":\"webui-updated\",\"client_payload\":{\"webui_ref\":\"${WEBUI_SHA}\",\"image_tag\":\"latest\"}}"
